name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      ELECTRIC_VISION_ROOT: ${{ github.workspace }}/electric-vision
      ALIEN_REQUIRE_LIVE_TEST: '1'
      ALIEN_TEST_ARTIFACTS: ${{ runner.temp }}/alien-world-artifacts
    steps:
      - name: Checkout alien-world
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: alien-world
          persist-credentials: false

      - name: Checkout companion electric-vision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CyclopsEyeTeam/electric-vision
          # Includes the Python 3.14 multiprocessing startup fix.
          ref: 5b11d4ce1a1aa0afdd1640bccc5bc4970e72d9e5
          path: electric-vision
          persist-credentials: false

      - name: Install Linux X11, GTK3, OpenGL, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            python3-cairo python3-pil python3-xlib build-essential \
            libgl1 libglx-mesa0 libgl1-mesa-dri libepoxy0 xvfb xauth

      - name: Build Electric Vision & Alien World native C fast-paths
        run: |
          make -C electric-vision build
          make -C alien-world build PYTHON=/usr/bin/python3

      - name: Verify setup check
        run: |
          cd alien-world
          /usr/bin/python3 ./bin/check-setup

      - name: Run unit + live headless Xvfb Electric Eye & MCP observation suite
        run: make -C alien-world test PYTHON=/usr/bin/python3

      - name: Upload failed live-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-test-diagnostics-${{ matrix.os }}
          path: ${{ env.ALIEN_TEST_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 7
