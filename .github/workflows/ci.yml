name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alien-world
        uses: actions/checkout@v4
        with:
          path: alien-world

      - name: Checkout companion electric-vision
        uses: actions/checkout@v4
        with:
          repository: CyclopsEyeTeam/electric-vision
          path: electric-vision

      - name: Install Linux X11, GTK3, OpenGL, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            python3-cairo python3-pil python3-xlib build-essential \
            libgl1 libglx-mesa0 libgl1-mesa-dri libepoxy0 xvfb xauth

      - name: Build Electric Vision & Alien World native C fast-paths
        run: |
          make -C electric-vision build
          make -C alien-world build

      - name: Verify setup check
        run: |
          cd alien-world
          ./bin/check-setup

      - name: Run unit + live headless Xvfb Electric Eye & MCP observation suite
        run: |
          cd alien-world
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +extension Composite" \
            env LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11 python3 -m unittest discover -s tests -v
